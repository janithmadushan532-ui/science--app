<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Science Gaming - O/L Science Game Hub</title>
<meta name="description" content="O/L Science interactive games, ionization energy challenges, and smart learning hub for Sri Lankan students.">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    color: #f8fafc;
    margin: 0;
    padding: 15px;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  .game-container {
    width: 100%;
    max-width: 420px;
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(56, 189, 248, 0.4);
    border-radius: 20px;
    padding: 25px 20px;
    box-shadow: 0 0 30px rgba(14, 165, 233, 0.25);
  }

  h1 {
    color: #38bdf8;
    font-size: 20px;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
  }

  p { color: #94a3b8; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }

  .badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 15px;
  }
  .badge-vip { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab308; }
  .badge-std { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #64748b; }

  .input-box { text-align: left; margin-bottom: 15px; }
  .input-box label { display: block; font-size: 12px; color: #38bdf8; font-weight: bold; margin-bottom: 6px; }
  .input-box input {
    width: 100%;
    padding: 12px 15px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
  }
  .input-box input:focus { border-color: #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.4); }

  .avatar-title { font-size: 12px; color: #38bdf8; font-weight: bold; text-align: left; margin-bottom: 8px; }
  .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .avatar-item {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 12px;
    font-size: 26px;
    padding: 8px;
    cursor: pointer;
  }
  .avatar-item.active { border-color: #10b981; background: rgba(16, 185, 129, 0.15); }

  .btn-main {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
  }

  /* Dashboard View */
  #dashboardView { display: none; text-align: left; }
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.6);
    padding: 12px 15px;
    border-radius: 12px;
    border: 1px solid #334155;
    margin-bottom: 15px;
  }
  .profile-info { display: flex; align-items: center; gap: 12px; }
  .profile-avatar { font-size: 30px; background: #1e293b; padding: 5px; border-radius: 50%; border: 1px solid #0ea5e9; }
  .profile-name { font-weight: bold; font-size: 14px; color: #f8fafc; }
  .profile-badge-text { font-size: 11px; color: #facc15; margin-top: 2px; }

  .btn-reset {
    background: rgba(244, 63, 94, 0.15);
    color: #f43f5e;
    border: 1px solid #f43f5e;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 10px;
    cursor: pointer;
    font-weight: bold;
  }

  .level-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .level-title { color: #34d399; font-weight: bold; font-size: 13px; margin-bottom: 3px; }
  .level-desc { color: #94a3b8; font-size: 11px; margin-bottom: 8px; }
 
  .btn-play {
    background: #10b981;
    color: #fff;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
    display: inline-block;
  }
</style>
</head>
<body>

<div class="game-container">

  <!-- 1. REGISTRATION SCREEN -->
  <div id="regView">
    <h1>🎮 Simple Science Gaming</h1>
    <p>O/L විද්‍යාව ස්මාර්ට් ක්‍රමයට සෙල්ලම් කරමින් ඉගෙන ගන්න!</p>

    <div id="accessBadgeContainer"></div>

    <div class="input-box">
      <label>ඔයාගේ නම (Player Name):</label>
      <input type="text" id="nameInput" placeholder="උදා: කසුන් පෙරේරා" maxlength="18">
    </div>

    <div class="avatar-title">Avatar එකක් තෝරන්න:</div>
    <div class="avatar-grid">
      <div class="avatar-item active" onclick="selectAvatar('👨‍🔬', this)">👨‍🔬</div>
      <div class="avatar-item" onclick="selectAvatar('👩‍🔬', this)">👩‍🔬</div>
      <div class="avatar-item" onclick="selectAvatar('🚀', this)">🚀</div>
      <div class="avatar-item" onclick="selectAvatar('⚡', this)">⚡</div>
    </div>

    <button class="btn-main" onclick="completeRegistration()">START GAMING 🚀</button>
  </div>

  <!-- 2. DASHBOARD SCREEN -->
  <div id="dashboardView">
    <div class="dash-header">
      <div class="profile-info">
        <div class="profile-avatar" id="dashAvatar">👨‍🔬</div>
        <div>
          <div class="profile-name" id="dashName">Player</div>
          <div class="profile-badge-text" id="dashBadgeText">Standard Mode</div>
        </div>
      </div>
      <button class="btn-reset" onclick="resetAccount()">Reset</button>
    </div>

    <h2 style="color: #38bdf8; font-size: 14px; text-align: left; margin-bottom: 10px;">🗺️ Game Levels</h2>

    <div class="level-card">
      <div class="level-title">Level 1: අයනිකරන ශක්ති අභියෝගය 💎</div>
      <div class="level-desc">තත්පර 60න් මූලද්‍රව්‍ය 20 සකස් කර Diamond Medal එක දිනාගන්න!</div>
      <a href="#" class="btn-play" onclick="alert('Level 1 Game එක ඊළඟ පියවරේදී මෙහි ක්‍රියාත්මක වේ!'); return false;">PLAY LEVEL ➔</a>
    </div>
  </div>

</div>

<script>
var selectedAvatarIcon = "👨‍🔬";
var isVipUser = false;

window.onload = function() {
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('src') === 'app') {
    isVipUser = true;
    document.getElementById("accessBadgeContainer").innerHTML = '<div class="badge badge-vip">👑 VIP IDEAMART APP ACCESS</div>';
  } else {
    document.getElementById("accessBadgeContainer").innerHTML = '<div class="badge badge-std">🌐 BROWSER ACCESS</div>';
  }

  var savedName = localStorage.getItem("ssg_name");
  var savedAvatar = localStorage.getItem("ssg_avatar");

  if (savedName) {
    showDashboard(savedName, savedAvatar);
  }
};

function selectAvatar(icon, element) {
  selectedAvatarIcon = icon;
  document.querySelectorAll('.avatar-item').forEach(item => item.classList.remove('active'));
  element.classList.add('active');
}

function completeRegistration() {
  var nameValue = document.getElementById("nameInput").value.trim();
  if (nameValue === "") {
    alert("කරුණාකර නම ඇතුළත් කරන්න!");
    return;
  }

  localStorage.setItem("ssg_name", nameValue);
  localStorage.setItem("ssg_avatar", selectedAvatarIcon);
  if (isVipUser) localStorage.setItem("ssg_vip", "true");

  showDashboard(nameValue, selectedAvatarIcon);
}

function showDashboard(name, avatar) {
  document.getElementById("regView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";
  document.getElementById("dashName").innerText = name;
  document.getElementById("dashAvatar").innerText = avatar;

  if (isVipUser || localStorage.getItem("ssg_vip") === "true") {
    document.getElementById("dashBadgeText").innerText = "👑 VIP Player (Bonus Active)";
  } else {
    document.getElementById("dashBadgeText").innerText = "🌐 Standard Player";
  }
}

function resetAccount() {
  if (confirm("ඔබට ගිණුම ඉවත් කිරීමට අවශ්‍යද?")) {
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
