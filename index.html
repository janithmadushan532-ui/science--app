<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Science Gaming</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0f18;
      --card-bg: #161b29;
      --neon-cyan: #00f3ff;
      --neon-pink: #ff0055;
      --neon-yellow: #ffeb3b;
      --neon-green: #00ff66;
      --text-color: #e0e6ed;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .container { width: 100%; max-width: 900px; background: var(--card-bg); border: 2px solid var(--neon-cyan); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); border-radius: 12px; padding: 25px; }
    h1, h2, h3 { font-family: 'Orbitron', sans-serif; text-transform: uppercase; text-align: center; letter-spacing: 2px; }
    .title-neon { color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); margin-bottom: 20px; }
    .auth-box { display: flex; flex-direction: column; gap: 15px; max-width: 400px; margin: 0 auto; }
    .input-group { display: flex; flex-direction: column; gap: 5px; }
    label { font-weight: bold; color: var(--neon-cyan); }
    input { padding: 12px; border-radius: 6px; border: 1px solid var(--neon-cyan); background: #090c15; color: #fff; font-size: 16px; outline: none; }
    input:focus { border-color: var(--neon-pink); box-shadow: 0 0 8px var(--neon-pink); }
    .btn { padding: 12px 20px; background: linear-gradient(45deg, var(--neon-cyan), var(--neon-pink)); border: none; color: #fff; font-family: 'Orbitron', sans-serif; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.3s; text-transform: uppercase; width: 100%; margin-top: 10px; }
    .btn:hover { box-shadow: 0 0 15px var(--neon-cyan); transform: translateY(-2px); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a334d; padding-bottom: 15px; margin-bottom: 20px; }
    .vip-tag { background: var(--neon-yellow); color: #000; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 12px; box-shadow: 0 0 10px var(--neon-yellow); }
    .chains-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .chain-card { background: #0d111d; border: 1px solid #2a334d; border-radius: 8px; padding: 15px; }
    .chain-card h3 { margin-bottom: 15px; color: var(--neon-pink); }
    .level-btn { width: 100%; padding: 10px; margin: 8px 0; background: #1a2238; border: 1px solid var(--neon-cyan); color: #fff; border-radius: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .level-btn.locked { border-color: #444; color: #666; cursor: not-allowed; background: #101420; }
    .chart-container { background: #0d111d; border: 1px solid var(--neon-cyan); padding: 15px; border-radius: 8px; }
    .chart-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #2a334d; }
    .timer-container { width: 100%; background: #101420; height: 20px; border-radius: 10px; overflow: hidden; border: 1px solid var(--neon-cyan); margin: 15px 0; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(90deg, var(--neon-green), var(--neon-yellow), var(--neon-pink)); transition: width 1s linear; }
    .badge-status { text-align: center; font-size: 18px; font-weight: bold; color: var(--neon-yellow); margin-bottom: 15px; }
    .graph-board { width: 100%; height: 250px; border-left: 2px solid var(--neon-cyan); border-bottom: 2px solid var(--neon-cyan); position: relative; margin: 20px 0; background: rgba(0, 243, 255, 0.02); }
    .graph-point { width: 32px; height: 32px; border: 2px dashed var(--neon-pink); border-radius: 50%; position: absolute; transform: translate(-50%, -50%); display: flex; justify-content: center; align-items: center; font-size: 11px; color: #888; cursor: pointer; }
    .graph-point.filled { border: 2px solid var(--neon-green); background: var(--neon-cyan); color: #000; font-weight: bold; box-shadow: 0 0 10px var(--neon-cyan); }
    .elements-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; }
    .elem-chip { padding: 8px 14px; background: #1f2942; border: 1px solid var(--neon-cyan); border-radius: 4px; cursor: pointer; font-weight: bold; }
    .elem-chip.selected { background: var(--neon-pink); box-shadow: 0 0 10px var(--neon-pink); }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title-neon">Simple Science Gaming</h1>

    <!-- 1. AUTH SCREEN -->
    <div id="auth-screen">
      <h2 style="margin-bottom: 20px; color: var(--neon-pink);">PLAYER LOGIN / REGISTER</h2>
      <div class="auth-box">
        <div class="input-group">
          <label for="username">Player Name:</label>
          <input type="text" id="username" placeholder="ඔබේ නම ඇතුළත් කරන්න">
        </div>
        <div class="input-group">
          <label for="password">Simple Password:</label>
          <input type="password" id="password" placeholder="සරල මුරපදයක් ඇතුළත් කරන්න">
        </div>
        <button type="button" class="btn" onclick="handleLogin()">Enter Game Arena</button>
      </div>
    </div>

    <!-- 2. MAIN DASHBOARD -->
    <div id="dashboard-screen" class="hidden">
      <div class="dashboard-header">
        <h2>ආයුබෝවන්, <span id="player-display-name" style="color: var(--neon-cyan);"></span>! 👋</h2>
        <span id="vip-badge" class="vip-tag hidden">VIP ACCESS</span>
      </div>

      <div class="chains-container">
        <!-- Easy Chain -->
        <div class="chain-card">
          <h3 style="color: var(--neon-green);">EASY CHAIN</h3>
          <button class="level-btn" onclick="startLevel('easy', 1)">
            <span>Level 1: අයණිකරණ ප්‍රස්තරය</span>
            <span id="badge-easy-1">🔓</span>
          </button>
          <button class="level-btn locked">
            <span>Level 2: Coming Soon</span>
            <span>🔒</span>
          </button>
        </div>

        <!-- Normal Chain -->
        <div class="chain-card">
          <h3 style="color: var(--neon-yellow);">NORMAL CHAIN</h3>
          <button class="level-btn locked">
            <span>Level 1: Unlocks Soon</span>
            <span>🔒</span>
          </button>
        </div>

        <!-- Hard Chain -->
        <div class="chain-card">
          <h3 style="color: var(--neon-pink);">HARD CHAIN</h3>
          <button class="level-btn locked">
            <span>Level 1: Unlocks Soon</span>
            <span>🔒</span>
          </button>
        </div>
      </div>

      <div class="chart-container">
        <h3>🏆 PERFORMANCE DASHBOARD CHART</h3>
        <div id="chart-content" style="margin-top: 10px;"></div>
      </div>
      <br>
      <button class="btn" style="background: #333;" onclick="logout()">Logout</button>
    </div>

    <!-- 3. GAME ARENA -->
    <div id="game-screen" class="hidden">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="color: var(--neon-cyan);">Level 1: මූලද්‍රව්‍ය 20 අයණිකරණ ශක්ති ප්‍රස්තරය</h3>
        <button class="btn" style="width: auto; padding: 5px 15px; margin: 0;" onclick="quitGame()">Exit</button>
      </div>

      <div class="timer-container">
        <div id="timer-bar" class="timer-bar"></div>
      </div>
      <div class="badge-status">
        කාලය: <span id="time-display">02:30</span> | Badge එක: <span id="current-badge-display">💎 Diamond</span>
      </div>

      <p style="text-align: center;">පහතින් මූලද්‍රව්‍යයක් තෝරා ප්‍රස්තරයේ නිවැරදි අංකය මත Click කරන්න:</p>

      <div class="graph-board" id="graph-board"></div>
      <div class="elements-pool" id="elements-pool"></div>
    </div>
  </div>

  <script>
    const elementsData = [
      { sym: 'H', x: 5, y: 30 }, { sym: 'He', x: 10, y: 90 },
      { sym: 'Li', x: 15, y: 15 }, { sym: 'Be', x: 20, y: 35 },
      { sym: 'B', x: 25, y: 30 }, { sym: 'C', x: 30, y: 45 },
      { sym: 'N', x: 35, y: 55 }, { sym: 'O', x: 40, y: 50 },
      { sym: 'F', x: 45, y: 70 }, { sym: 'Ne', x: 50, y: 85 },
      { sym: 'Na', x: 55, y: 12 }, { sym: 'Mg', x: 60, y: 30 },
      { sym: 'Al', x: 65, y: 25 }, { sym: 'Si', x: 70, y: 40 },
      { sym: 'P', x: 75, y: 50 }, { sym: 'S', x: 80, y: 45 },
      { sym: 'Cl', x: 85, y: 65 }, { sym: 'Ar', x: 90, y: 80 },
      { sym: 'K', x: 95, y: 10 }, { sym: 'Ca', x: 98, y: 25 }
    ];

    let currentUser = null;
    let selectedElement = null;
    let gameTimer = null;
    let timeLeft = 150;
    const maxTime = 150;
    let placedCount = 0;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('src') === 'app') {
        document.getElementById('vip-badge').classList.remove('hidden');
      }

      const activeName = localStorage.getItem('ssg_active_session');
      if (activeName) {
        const data = JSON.parse(localStorage.getItem('ssg_user_' + activeName));
        if (data) {
          currentUser = data;
          showDashboard();
        }
      }
    };

    function handleLogin() {
      const name = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value;

      if(!name || !pass) {
        alert('దయவுකරලා නම සහ මුරපදය ඇතුළත් කරන්න!');
        return;
      }

      let storedData = JSON.parse(localStorage.getItem('ssg_user_' + name));

      if (storedData) {
        if (storedData.password !== pass) {
          alert('වැරදි Password එකක්!');
          return;
        }
      } else {
        storedData = {
          name: name,
          password: pass,
          progress: { easy: { 1: null } }
        };
        localStorage.setItem('ssg_user_' + name, JSON.stringify(storedData));
      }

      currentUser = storedData;
      localStorage.setItem('ssg_active_session', name);
      showDashboard();
    }

    function showDashboard() {
      document.getElementById('auth-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('dashboard-screen').classList.remove('hidden');
      document.getElementById('player-display-name').innerText = currentUser.name;

      const easy1Badge = currentUser.progress.easy[1] || 'ලබාගෙන නැත ❌';
      document.getElementById('badge-easy-1').innerText = currentUser.progress.easy[1] || '🔓';

      const chartBox = document.getElementById('chart-content');
      chartBox.innerHTML = `<div class="chart-row"><span>Easy Chain - Level 1 (අයණිකරණ ශක්තිය)</span> <span><b>${easy1Badge}</b></span></div>`;
    }

    function logout() {
      localStorage.removeItem('ssg_active_session');
      location.reload();
    }

    function startLevel(chain, level) {
      if (chain === 'easy' && level === 1) {
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        initGraphGame();
      }
    }

    function initGraphGame() {
      timeLeft = 150;
      placedCount = 0;
      selectedElement = null;

      const board = document.getElementById('graph-board');
      const pool = document.getElementById('elements-pool');
      board.innerHTML = '';
      pool.innerHTML = '';

      elementsData.forEach((elem, index) => {
        const point = document.createElement('div');
        point.className = 'graph-point';
        point.style.left = elem.x + '%';
        point.style.bottom = elem.y + '%';
        point.innerText = index + 1;

        point.onclick = function() {
          if (selectedElement === elem.sym) {
            point.innerText = elem.sym;
            point.classList.add('filled');
            document.getElementById('chip-' + elem.sym).style.visibility = 'hidden';
            selectedElement = null;
            placedCount++;

            if (placedCount === elementsData.length) {
              finishGame();
            }
          }
        };
        board.appendChild(point);

        const chip = document.createElement('div');
        chip.className = 'elem-chip';
        chip.id = 'chip-' + elem.sym;
        chip.innerText = elem.sym;

        chip.onclick = function() {
          document.querySelectorAll('.elem-chip').forEach(c => c.classList.remove('selected'));
          chip.classList.add('selected');
          selectedElement = elem.sym;
        };
        pool.appendChild(chip);
      });

      startTimer();
    }

    function startTimer() {
      clearInterval(gameTimer);
      updateTimerUI();

      gameTimer = setInterval(() => {
        timeLeft--;
        updateTimerUI();

        if (timeLeft <= 0) {
          clearInterval(gameTimer);
          alert('කාලය අවසන්! නැවත උත්සාහ කරන්න.');
          quitGame();
        }
      }, 1000);
    }

    function updateTimerUI() {
      const mins = Math.floor(timeLeft / 60);
      const secs = timeLeft % 60;
      document.getElementById('time-display').innerText =
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

      const pct = (timeLeft / maxTime) * 100;
      document.getElementById('timer-bar').style.width = pct + '%';

      const timeSpent = maxTime - timeLeft;
      let badgeText = '';

      if (timeSpent <= 60) badgeText = '💎 Diamond Badge';
      else if (timeSpent <= 90) badgeText = '🥇 Gold Badge';
      else if (timeSpent <= 150) badgeText = '🥉 Bronze Badge';
      else badgeText = '❌ No Badge';

      document.getElementById('current-badge-display').innerText = badgeText;
    }

    function finishGame() {
      clearInterval(gameTimer);
      const timeSpent = maxTime - timeLeft;
      let earnedBadge = 'No Badge ❌';

      if (timeSpent <= 60) earnedBadge = '💎 Diamond';
      else if (timeSpent <= 90) earnedBadge = '🥇 Gold';
      else if (timeSpent <= 150) earnedBadge = '🥉 Bronze';

      currentUser.progress.easy[1] = earnedBadge;
      localStorage.setItem('ssg_user_' + currentUser.name, JSON.stringify(currentUser));

      alert(`සුභ පැතුම්! ඔබ ${earnedBadge} එකක් දිනාගත්තා! 🎉`);
      showDashboard();
    }

    function quitGame() {
      clearInterval(gameTimer);
      showDashboard();
    }
  </script>
</body>
</html>
