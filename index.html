<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O/L Science Game Hub - Next Level</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
  body {
    background: radial-gradient(circle at center, #0f172a 0%, #020617 100%);
    color: #f8fafc;
    margin: 0;
    padding: 15px;
    text-align: center;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  /* Main Container */
  .game-container {
    width: 100%;
    max-width: 420px;
    background: rgba(30, 41, 59, 0.75);
    backdrop-filter: blur(12px);
    border: 2px solid rgba(56, 189, 248, 0.4);
    border-radius: 20px;
    padding: 30px 20px;
    box-shadow: 0 0 30px rgba(14, 165, 233, 0.25);
    animation: fadeIn 0.5s ease-in-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 {
    color: #38bdf8;
    font-size: 22px;
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-shadow: 0 0 12px rgba(56, 189, 248, 0.5);
  }

  p { color: #94a3b8; font-size: 13px; margin-bottom: 25px; line-height: 1.5; }

  /* VIP & Standard Badges */
  .badge {
    display: inline-block;
    padding: 5px 14px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: bold;
    margin-bottom: 15px;
    letter-spacing: 0.5px;
  }
  .badge-vip { background: rgba(234, 179, 8, 0.15); color: #facc15; border: 1px solid #eab308; box-shadow: 0 0 10px rgba(234,179,8,0.2); }
  .badge-std { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #64748b; }

  /* Input Field */
  .input-box {
    text-align: left;
    margin-bottom: 20px;
  }
  .input-box label {
    display: block;
    font-size: 12px;
    color: #38bdf8;
    font-weight: bold;
    margin-bottom: 6px;
  }
  .input-box input {
    width: 100%;
    padding: 12px 15px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
  }
  .input-box input:focus {
    border-color: #38bdf8;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
  }

  /* Avatar Picker */
  .avatar-title { font-size: 12px; color: #38bdf8; font-weight: bold; text-align: left; margin-bottom: 8px; }
  .avatar-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 25px;
  }
  .avatar-item {
    background: #0f172a;
    border: 2px solid #334155;
    border-radius: 12px;
    font-size: 26px;
    padding: 10px;
    cursor: pointer;
    transition: 0.2s;
  }
  .avatar-item:hover { border-color: #0ea5e9; }
  .avatar-item.active {
    border-color: #10b981;
    background: rgba(16, 185, 129, 0.15);
    transform: scale(1.08);
    box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
  }

  /* Start Button */
  .btn-main {
    background: linear-gradient(135deg, #0ea5e9, #0284c7);
    color: white;
    border: none;
    width: 100%;
    padding: 14px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.4);
    transition: 0.2s;
  }
  .btn-main:active { transform: scale(0.97); }

  /* Dashboard View */
  #dashboardView { display: none; text-align: left; }
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(15, 23, 42, 0.6);
    padding: 12px 15px;
    border-radius: 12px;
    border: 1px solid #334155;
    margin-bottom: 20px;
  }
  .profile-info { display: flex; align-items: center; gap: 12px; }
  .profile-avatar { font-size: 32px; background: #1e293b; padding: 5px; border-radius: 50%; border: 1px solid #0ea5e9; }
  .profile-name { font-weight: bold; font-size: 15px; color: #f8fafc; }
  .profile-badge-text { font-size: 11px; color: #facc15; margin-top: 2px; }

  .btn-reset {
    background: rgba(244, 63, 94, 0.15);
    color: #f43f5e;
    border: 1px solid #f43f5e;
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 11px;
    cursor: pointer;
    font-weight: bold;
  }

  .level-card {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid #334155;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 12px;
    transition: 0.2s;
  }
  .level-card:hover { border-color: #0ea5e9; box-shadow: 0 0 12px rgba(14,165,233,0.2); }
  .level-title { color: #34d399; font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .level-desc { color: #94a3b8; font-size: 11px; margin-bottom: 10px; }
 
  .btn-play {
    background: #10b981;
    color: #fff;
    text-decoration: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: bold;
    display: inline-block;
    box-shadow: 0 3px 10px rgba(16, 185, 129, 0.3);
  }
</style>
</head>
<body>

<div class="game-container">

  <!-- 1. REGISTRATION SCREEN -->
  <div id="regView">
    <h1>⚡ Science Game Hub</h1>
    <p>O/L විද්‍යාව ජයගන්න ස්මාර්ට් ක්‍රමයට සෙල්ලම් කරමු!</p>

    <div id="accessBadgeContainer"></div>

    <div class="input-box">
      <label>ඔයාගේ නම (Player Name):</label>
      <input type="text" id="nameInput" placeholder="උදා: කසුන් පෙරේරා" maxlength="18">
    </div>

    <div class="avatar-title">ඔයාගේ Game Avatar එක තෝරන්න:</div>
    <div class="avatar-grid">
      <div class="avatar-item active" onclick="selectAvatar('👨‍🔬', this)">👨‍🔬</div>
      <div class="avatar-item" onclick="selectAvatar('👩‍🔬', this)">👩‍🔬</div>
      <div class="avatar-item" onclick="selectAvatar('🚀', this)">🚀</div>
      <div class="avatar-item" onclick="selectAvatar('⚡', this)">⚡</div>
    </div>

    <button class="btn-main" onclick="completeRegistration()">REGISTER & START 🎮</button>
  </div>

  <!-- 2. DASHBOARD SCREEN (Hidden initially) -->
  <div id="dashboardView">
    <div class="dash-header">
      <div class="profile-info">
        <div class="profile-avatar" id="dashAvatar">👨‍🔬</div>
        <div style="text-align: left;">
          <div class="profile-name" id="dashName">Player</div>
          <div class="profile-badge-text" id="dashBadgeText">Standard Mode</div>
        </div>
      </div>
      <button class="btn-reset" onclick="resetAccount()">ගිණුම මකන්න</button>
    </div>

    <h2 style="color: #38bdf8; font-size: 16px; text-align: left; margin-bottom: 12px;">🗺️ Game Levels</h2>

    <div class="level-card">
      <div class="level-title">Level 1: අයනිකරන ශක්ති අභියෝගය 💎</div>
      <div class="level-desc">තත්පර 60 ඇතුළත මූලද්‍රව්‍ය 20 සකස් කර Diamond Medal එක දිනාගන්න!</div>
      <a href="#" class="btn-play" onclick="alert('මීළඟ පියවරේදී මෙම ලෙවල් එක සම්පූර්ණයෙන්ම සක්‍රීය වේ!'); return false;">PLAY LEVEL ➔</a>
    </div>
  </div>

</div>

<script>
var selectedAvatarIcon = "👨‍🔬";
var isVipUser = false;

// Page Load එකේදී Run වෙන කොටස
window.onload = function() {
  // 1. Ideamart App එකෙන් එනවාදැයි බැලීම (?src=app)
  const urlParams = new URLSearchParams(window.location.search);
  if (urlParams.get('src') === 'app') {
    isVipUser = true;
    document.getElementById("accessBadgeContainer").innerHTML = '<div class="badge badge-vip">👑 VIP IDEAMART APP ACCESS UNLOCKED</div>';
  } else {
    document.getElementById("accessBadgeContainer").innerHTML = '<div class="badge badge-std">🌐 WEB BROWSER ACCESS</div>';
  }

  // 2. කලින් Register වී ඇත්දැයි බැලීම (Local Storage Check)
  var savedName = localStorage.getItem("sc_hub_name");
  var savedAvatar = localStorage.getItem("sc_hub_avatar");

  if (savedName) {
    showDashboard(savedName, savedAvatar);
  }
};

function selectAvatar(icon, element) {
  selectedAvatarIcon = icon;
  var items = document.querySelectorAll('.avatar-item');
  items.forEach(item => item.classList.remove('active'));
  element.classList.add('active');
}

function completeRegistration() {
  var nameValue = document.getElementById("nameInput").value.trim();
 
  if (nameValue === "") {
    alert("⚠️ කරුණාකර ක්‍රීඩකයාගේ නම ඇතුළත් කරන්න!");
    document.getElementById("nameInput").focus();
    return;
  }

  // Save to LocalStorage
  localStorage.setItem("sc_hub_name", nameValue);
  localStorage.setItem("sc_hub_avatar", selectedAvatarIcon);
  if (isVipUser) {
    localStorage.setItem("sc_hub_vip", "true");
  }

  showDashboard(nameValue, selectedAvatarIcon);
}

function showDashboard(name, avatar) {
  document.getElementById("regView").style.display = "none";
  document.getElementById("dashboardView").style.display = "block";

  document.getElementById("dashName").innerText = name;
  document.getElementById("dashAvatar").innerText = avatar;

  if (isVipUser || localStorage.getItem("sc_hub_vip") === "true") {
    document.getElementById("dashBadgeText").innerText = "👑 VIP Player (Bonus Active)";
  } else {
    document.getElementById("dashBadgeText").innerText = "🌐 Standard Player";
  }
}

function resetAccount() {
  if (confirm("ඔබට මෙම ගිණුම ඉවත් කර අලුතින් නමක් දීමට අවශ්‍යද?")) {
    localStorage.clear();
    location.reload();
  }
}
</script>

</body>
</html>
