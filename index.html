<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cell Biology Shooter Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #question-box {
            font-size: 22px;
            font-weight: bold;
            background-color: #333;
            padding: 12px 25px;
            border-radius: 10px;
            margin-bottom: 15px;
            border: 2px solid #00E676;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #stats {
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        canvas {
            border: 3px solid #00E676;
            background-color: #1e272e;
            cursor: crosshair;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div id="stats">
        Score: <span id="score" style="color: #FFD700;">0</span> |
        Time Left: <span id="timer" style="color: #FF5252;">60</span>s
    </div>

    <div id="question-box">
        ප්‍රශ්නය: <span id="question" style="color: #00E676;">Loading...</span>
    </div>

    <canvas id="gameCanvas" width="850" height="500"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const questionEl = document.getElementById('question');
        const scoreEl = document.getElementById('score');
        const timerEl = document.getElementById('timer');

        let score = 0;
        let timeLeft = 60;
        let gameOver = false;

        // Player Cannon
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 30,
            radius: 20
        };

        const mouse = { x: canvas.width / 2, y: canvas.height / 2 };

        // Questions Array
        const questions = [
            { q: "ශාක සෛලයක ප්‍රකාශ සංස්ලේෂණය සිදුවන ඉන්ද්‍රියිකාව කුමක්ද?", correct: "හරිතලවය" },
            { q: "සත්ත්ව සෛලයක ශක්තිය නිපදවන 'ශක්ති ජනකගාරය' කුමක්ද?", correct: "මයිට්‍රෝකොන්ඩ්‍රියාව" },
            { q: "සෛලයේ පාලන මධ්‍යස්ථානය ලෙස ක්‍රියා කරන්නේ කුමක්ද?", correct: "න්‍යෂ්ටිය" },
            { q: "ප්‍රෝටීන් සංස්ලේෂණය සිදුකරන ඉන්ද්‍රියිකාව කුමක්ද?", correct: "රයිබොසෝම" },
            { q: "ශාක සෛලයකට පමණක් ආවේණික හැඩයක් ලබාදෙන බාහිර ආවරණය කුමක්ද?", correct: "සෛල බිත්තිය" },
            { q: "ශාක සෛලයේ විශාලව පිහිටන ජලය සහ ද්‍රව්‍ය ගබඩා කරන ඉන්ද්‍රියිකාව කුමක්ද?", correct: "ධාතුකය" }
        ];

        const organelles = [
            "හරිතලවය", "මයිට්‍රෝකොන්ඩ්‍රියාව", "න්‍යෂ්ටිය",
            "රයිබොසෝම", "සෛල බිත්තිය", "ධාතුකය", "ගොල්ගි දේහය"
        ];

        let currentQuestion = {};
        const bullets = [];
        const targets = [];

        // Track Mouse
        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        // Click to Shoot
        canvas.addEventListener('click', () => {
            if (gameOver) return;
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            bullets.push({
                x: player.x,
                y: player.y,
                vx: Math.cos(angle) * 12,
                vy: Math.sin(angle) * 12,
                radius: 6
            });
        });

        function setNextQuestion() {
            const randomIndex = Math.floor(Math.random() * questions.length);
            currentQuestion = questions[randomIndex];
            questionEl.innerText = currentQuestion.q;
            spawnTargets();
        }

        function spawnTargets() {
            targets.length = 0; // Clear existing targets

            // Select 4 choices including the correct one
            let choices = [currentQuestion.correct];
            while (choices.length < 4) {
                let randomOrganelle = organelles[Math.floor(Math.random() * organelles.length)];
                if (!choices.includes(randomOrganelle)) {
                    choices.push(randomOrganelle);
                }
            }

            // Shuffle choices
            choices.sort(() => Math.random() - 0.5);

            // Create target circles
            choices.forEach((name, index) => {
                targets.push({
                    x: 120 + index * 190,
                    y: 100 + Math.random() * 80,
                    radius: 45,
                    name: name,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 1.5
                });
            });
        }

        // Timer Function
        const timerInterval = setInterval(() => {
            if (!gameOver) {
                timeLeft--;
                timerEl.innerText = timeLeft;
                if (timeLeft <= 0) {
                    gameOver = true;
                    clearInterval(timerInterval);
                    alert("Game Over! ඔයාගේ මුළු ලකුණු ප්‍රමාණය: " + score);
                    location.reload();
                }
            }
        }, 1000);

        function update() {
            if (gameOver) return;

            // Move Bullets
            bullets.forEach((b, bIdx) => {
                b.x += b.vx;
                b.y += b.vy;

                // Remove out-of-screen bullets
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
                    bullets.splice(bIdx, 1);
                }
            });

            // Move Targets & Check Collision
            targets.forEach(t => {
                t.x += t.vx;
                t.y += t.vy;

                // Bounce off walls
                if (t.x - t.radius < 0 || t.x + t.radius > canvas.width) t.vx *= -1;
                if (t.y - t.radius < 0 || t.y + t.radius > 300) t.vy *= -1;

                // Check Bullet hit
                bullets.forEach((b, bIdx) => {
                    const dist = Math.hypot(b.x - t.x, b.y - t.y);
                    if (dist - t.radius - b.radius < 0) {
                        bullets.splice(bIdx, 1);

                        if (t.name === currentQuestion.correct) {
                            score += 10;
                            scoreEl.innerText = score;
                            setNextQuestion(); // Move to next question
                        } else {
                            score = Math.max(0, score - 5); // Deduct score
                            scoreEl.innerText = score;
                        }
                    }
                });
            });
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Targets
            targets.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#00B0FF';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#353b48';
                ctx.stroke();

                // Target Text
                ctx.fillStyle = 'white';
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(t.name, t.x, t.y + 4);
            });

            // Draw Shooter Cannon
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#FF9F43';
            ctx.fill();

            // Gun Aim Line
            const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(angle) * 35, player.y + Math.sin(angle) * 35);
            ctx.strokeStyle = '#FF9F43';
            ctx.lineWidth = 6;
            ctx.stroke();

            // Draw Bullets
            bullets.forEach(b => {
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#FF5252';
                ctx.fill();
            });
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        // Start Game
        setNextQuestion();
        loop();
    </script>
</body>
</html>
